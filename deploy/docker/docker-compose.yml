# Gorget server, simplest setup: SQLite + built-in HTTPS with automatic Let's Encrypt certificates.
#
#   1. Point a DNS name (for example vpn.example.com) at this server.
#   2. Copy .env.example to .env and set GORGET_DOMAIN (and GORGET_EMAIL).
#   3. docker compose up -d
#   4. docker compose exec gorget gorget-server setup-link    -> open the link it prints
#
# Open these ports in the server's firewall / cloud security group:
#   TCP 80, 443 (web console, apps, certificates)   UDP 443 (HTTP/3)
#   UDP 3478 (STUN)   UDP 3479 (UDP relay)   UDP 51820 (WireGuard apps, optional)
#
# Easier: the installer does steps 2 and 3 for you:
#   curl -fsSL https://raw.githubusercontent.com/anand34577/gorget/main/install-server.sh | sh -s -- --docker
services:
  gorget:
    image: ghcr.io/anand34577/gorget:${GORGET_VERSION:-latest}
    build: ../..
    container_name: gorget
    restart: unless-stopped
    environment:
      GORGET_PUBLIC_URL: https://${GORGET_DOMAIN:?Set GORGET_DOMAIN in the .env file, e.g. GORGET_DOMAIN=vpn.example.com}
      GORGET_TLS_EMAIL: ${GORGET_EMAIL:-}
      GORGET_TLS_STAGING: ${GORGET_TLS_STAGING:-false}   # true while testing: avoids Let's Encrypt rate limits
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
      - "3478:3478/udp"
      - "3479:3479/udp"
      - "51820:51820/udp"
    volumes:
      - gorget-data:/var/lib/gorget   # database, master.key, backups: back this up
    cap_add:
      - NET_ADMIN # WireGuard interface, routes and nftables
    devices:
      - /dev/net/tun # userspace WireGuard fallback
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  gorget-data:
