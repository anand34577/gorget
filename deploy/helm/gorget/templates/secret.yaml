{{- $needMaster := not .Values.masterKey.existingSecret }}
{{- $needDSN := and (eq .Values.database.driver "postgres") (not .Values.database.existingSecret) }}
{{- if or $needMaster $needDSN }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gorget.fullname" . }}-secrets
  labels: {{- include "gorget.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $needMaster }}
  master-key: {{ required "set masterKey.value (gorget-server gen-master-key) or masterKey.existingSecret" .Values.masterKey.value | quote }}
  {{- end }}
  {{- if $needDSN }}
  dsn: {{ required "set database.dsn or database.existingSecret for PostgreSQL" .Values.database.dsn | quote }}
  {{- end }}
{{- end }}
