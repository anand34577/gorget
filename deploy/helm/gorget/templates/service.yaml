apiVersion: v1
kind: Service
metadata:
  name: {{ include "gorget.fullname" . }}
  labels: {{- include "gorget.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "gorget.selector" . | nindent 4 }}
  ports:
    - {name: http, port: {{ if eq .Values.tls.mode "off" }}80{{ else }}443{{ end }}, targetPort: http, protocol: TCP}
{{- if or .Values.stun.enabled .Values.relay.udp.enabled .Values.gateway.enabled }}
---
# UDP ports get their own Service: many clouds cannot mix TCP and UDP on one load balancer.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gorget.fullname" . }}-udp
  labels: {{- include "gorget.labels" . | nindent 4 }}
  {{- with .Values.service.udp.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.udp.type }}
  {{- if .Values.service.udp.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.udp.loadBalancerIP }}
  {{- end }}
  selector: {{- include "gorget.selector" . | nindent 4 }}
  ports:
    {{- if .Values.stun.enabled }}
    - {name: stun, port: 3478, targetPort: stun, protocol: UDP}
    {{- end }}
    {{- if .Values.relay.udp.enabled }}
    - {name: relay-udp, port: {{ .Values.relay.udp.port }}, targetPort: relay-udp, protocol: UDP}
    {{- end }}
    {{- if .Values.gateway.enabled }}
    - {name: wireguard, port: {{ .Values.gateway.port }}, targetPort: wireguard, protocol: UDP}
    {{- end }}
{{- end }}
