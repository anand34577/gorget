# Gorget behind Nginx. Run gorget-server with tls.mode=off, http.listen=127.0.0.1:8080 and
# http.trusted_proxies=[127.0.0.1/32]. UDP 3478 (STUN) and 51820 (WireGuard) must reach Gorget directly.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream gorget {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name vpn.example.com;
    ssl_certificate     /etc/letsencrypt/live/vpn.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpn.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;

    # Client control API (ConnectRPC): streaming over HTTP/2 needs grpc_pass so frames flow immediately.
    location /gorget.v1.ControlService/ {
        grpc_pass grpc://gorget;
        grpc_read_timeout 1h;
        grpc_send_timeout 1h;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto https;
    }

    # Relay (WebSocket) and live console events (SSE): no buffering, long timeouts.
    location ~ ^/(relay|api/v1/events)$ {
        proxy_pass http://gorget;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://gorget;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name vpn.example.com;
    return 308 https://$host$request_uri;
}
