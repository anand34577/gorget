Builds:
  - versionName: 0.4.0
    versionCode: 4
    commit: v0.4.0
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y golang-go
    init: go install golang.org/x/mobile/cmd/gomobile@latest && go install golang.org/x/mobile/cmd/gobind@latest
    gradle:
      - yes
    prebuild:
      - export PATH=$PATH:$HOME/go/bin
      - cd ../.. && gomobile init
      - cd ../.. && gomobile bind -target=android/arm64,android/arm,android/amd64 -androidapi 26 -javapkg io.gorget -trimpath -ldflags "-s -w" -o android/app/libs/gorgetcore.aar ./mobile/gorgetcore
    ndk: r28b

