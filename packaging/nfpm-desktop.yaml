# Tray app package (needs GTK3 and WebKitGTK at runtime): depends on the "gorget" service package.
#   VERSION=1.2.3 ARCH=amd64 nfpm package -f packaging/nfpm-desktop.yaml -p deb
name: gorget-desktop
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Gorget contributors <noreply@gorget.invalid>
description: Gorget tray app and window.
homepage: https://github.com/anand34577/gorget
license: AGPL-3.0-only
depends:
  - gorget (= ${VERSION})
  - libgtk-3-0
  - libwebkit2gtk-4.1-0
overrides:
  rpm:
    depends:
      - gorget = ${VERSION}
      - gtk3
      - webkit2gtk4.1
contents:
  - src: bin/linux-${ARCH}/gorget-desktop
    dst: /usr/bin/gorget-desktop
    file_info: { mode: 0755 }
  - src: packaging/linux/gorget-desktop.desktop
    dst: /usr/share/applications/gorget.desktop
  - src: packaging/linux/gorget-autostart.desktop
    dst: /etc/xdg/autostart/gorget.desktop
  - src: desktop/icons/app.png
    dst: /usr/share/icons/hicolor/512x512/apps/gorget.png
