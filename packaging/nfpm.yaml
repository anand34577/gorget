# Builds .deb and .rpm:  VERSION=1.2.3 ARCH=amd64 nfpm package -f packaging/nfpm.yaml -p deb
# Expects bin/linux-$ARCH/gorget (CGO off) and, for the "gorget-desktop" variant, bin/linux-$ARCH/gorget-desktop.
name: gorget
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Gorget contributors <noreply@gorget.invalid>
description: |
  Gorget mesh VPN client: background service, command-line tool and (optionally) tray app.
  Connects this computer to your self-hosted Gorget network over WireGuard.
homepage: https://github.com/anand34577/gorget
license: AGPL-3.0-only
depends:
  - nftables
recommends:
  - systemd-resolved
contents:
  - src: bin/linux-${ARCH}/gorget
    dst: /usr/bin/gorget
    file_info: { mode: 0755 }
  - src: packaging/linux/gorget.service
    dst: /lib/systemd/system/gorget.service
    file_info: { mode: 0644 }
  - src: LICENSE
    dst: /usr/share/doc/gorget/copyright
scripts:
  postinstall: packaging/linux/postinst.sh
  preremove: packaging/linux/prerm.sh
overrides:
  rpm:
    depends:
      - nftables
